<!DOCTYPE html>
<html lang = "eng">
	<head>
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width-device-width, initial-scale=1.0">
		<meta name = "keywords" content = "HTML5, HTML 5, Semantics">
		
		<title>CSS Flex Grid Layout</title>

        <style>
            body {
                margin: 0; 
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #333;
                color: white;
                padding: 15px;
            }

            .container {
                display: flex;
                flex: 1;
            }

            .sidebar {
                width: 200px;
                background-color: #222;
                color: white;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 10x;
            }

            .main-content {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 200px);
                gap: 15px;
                padding: 20px;
                flex: 1;
                background: #f4f4f4;
            }

            .box {
                background-color: white;
                border-radius: 5px;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                font-weight: bold;
            }

        </style>
    </head>
    <body>
        <div class = "container">		
			<div class = "main-content">
				<h2>Main Content</h2>
				<p>This is an example of a felxible layout using CSS Grid.</p>
			</div>
            <div class = "sidebar">
			    <h2>Sidebar</h2>
			    <p>Additional context or links go here.</p>
		</div>
        </div>
            
        <div class = "box">
			    <p>This is a box.</p>
		</div>
    </body>
</html>
