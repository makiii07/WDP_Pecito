
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Basic styling for demo */
        body { font-family: Arial, sans-serif; margin: 40px; }
        header { background: #333; color: white; padding: 20px; text-align: center; }
        nav { background: #f4f4f4; padding: 10px; text-align: center; }
        nav a { margin: 0 15px; text-decoration: none; color: #333; }
        section { padding: 20px; border-bottom: 1px solid #ddd; }
        article { margin: 20px 0; padding: 20px; background: #f9f9f9; }
        footer { background: #333; color: white; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <!-- Step 1: Header ✅ -->
    <header>
        <h1>My Website</h1>
    </header>

    <!-- Step 2: Navigation ✅ Fixed -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Step 3: Section ✅ Fixed with content -->
    <section id="about">
        <h2>About</h2>
        <p>This is the about section with meaningful content.</p>
    </section>

    <!-- Step 4: Article ✅ Perfect -->
    <article>
        <h3>Featured Article</h3>
        <p>Content here - This article contains important information about our website.</p>
    </article>

    <!-- Step 5: Footer ✅ Perfect (replace SURNAME with your actual surname) -->
    <footer>
        <p>© [PECITO] 2026</p>
    </footer>
</body>
</html>
